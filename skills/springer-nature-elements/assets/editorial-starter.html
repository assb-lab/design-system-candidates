<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research article — neutral editorial sample</title>
  <link rel="stylesheet" href="./editorial-starter.css">
</head>
<body>
  <!-- Original research article scaffold. Not an official Nature/Elements template. -->
  <header>
    <p>RESEARCH NOTES / ORIGINAL EDITORIAL SAMPLE</p>
    <h1>仮説と測定結果を読みやすく伝える</h1>
  </header>
  <main>
    <article>
      <h2>概要</h2>
      <p>この領域に原データに基づく研究目的・結果の概要を記入してください。</p>
      <h2>主要な図版</h2>
      <figure>
        <div class="placeholder" role="img" aria-label="実験データに基づく図をここに挿入">実測データの図版を挿入</div>
        <figcaption>図1：試料、軸の単位、測定条件、出典を記入。</figcaption>
      </figure>
      <h2>研究方法</h2>
      <p>使用した装置・分析条件・データの処理方法を記載してください。</p>
    </article>
    <aside aria-label="論文情報">
      <h2>この研究について</h2>
      <p>発表者、所属、DOI、データ公開情報などを整理するための領域です。</p>
    </aside>
  </main>
  <footer>Independent sample by assb-lab. Not an official Springer Nature or Nature template.</footer>
</body>
</html>
