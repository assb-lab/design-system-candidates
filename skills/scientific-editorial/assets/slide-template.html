<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scientific Editorial — Slide starter</title>
<link rel="stylesheet" href="./tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--research-background);color:var(--research-text);font-family:var(--research-font-ja)}
.slide{max-width:1920px;width:100%;aspect-ratio:16/9;min-height:600px;margin:auto;padding:5% 7%;display:grid;grid-template-rows:auto 1fr auto;gap:4%}
.eyebrow{color:var(--research-primary);font-weight:700;font-size:clamp(13px,1.4vw,27px);letter-spacing:.08em}
h1{font-size:clamp(28px,3.4vw,66px);line-height:1.2;letter-spacing:-.025em;margin:.3em 0 0}
.rule{height:7px;width:13%;background:var(--research-accent);margin-top:20px}
.content{min-height:0;display:grid;grid-template-columns:1.7fr 1fr;gap:4%}
.figure{display:grid;place-items:center;min-height:30vh;padding:5%;background:var(--research-surface);border:1px solid var(--research-border)}
.figure p{font-size:clamp(16px,1.7vw,32px);color:var(--research-muted);text-align:center}
aside{align-self:center}aside h2{font-size:clamp(22px,2vw,38px);color:var(--research-primary)}
aside p{font-size:clamp(16px,1.45vw,28px);line-height:1.55}
footer{border-top:1px solid var(--research-border);padding-top:18px;font-size:clamp(12px,1.05vw,20px);color:var(--research-muted);display:flex;justify-content:space-between}
@media(max-width:700px){.slide{aspect-ratio:auto;min-height:100vh}.content{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="slide" aria-label="Scientific Editorial slide example">
<header><div class="eyebrow">RESEARCH / RESULTS</div><h1>ここに結論が伝わるタイトルを入れる</h1><div class="rule"></div></header>
<main class="content">
<div class="figure" role="img" aria-label="ここに実データの図を配置"><p>実測データのSVG / 画像を配置</p></div>
<aside><h2>主要な観察結果</h2><p>試料名、実験条件、定量値、出典を実データから追記してください。</p></aside>
</main>
<footer><span>研究発表タイトル / 所属</span><span>01</span></footer>
</section>
</body></html>
